<!DOCTYPE html>
<html lang="gr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body>
<div class="container">
    <header th:replace="~{fragments/header :: header(extended=false)}"></header>

    <main>
        <h1>Register</h1>

        <th:block th:switch="${status}">
            <article th:case="'dataValidated'">
                <div class="success-message">
                    Επιτυχής Εγγραφή! Συνδεθείτε στο email σας, για την απαραίτητη επαλήθευση!
                </div>
            </article>
            <article th:case="'verifyFailed'">
                <div class="error-message">
                    Αποτυχία στην επαλήθευση της εγγραφής, παρακαλώ προχωρήστε ξανά σε <a href="/register">εγγραφή</a>
                </div>
            </article>
            <article th:case="'verifySucceeded'">
                <div class="success-message">
                    Ο λογαριασμός σας επαληθεύτηκε! Προχωρήστε σε <a href="/login">login</a>
                </div>
            </article>

            <article th:case="*">
                <form th:action="@{/register}" th:object="${formRegister}" method="post" class="form contact">
                    <label for="txtName">Ονοματεπώνυμο(*):</label>
                    <input type="text" id="txtName" name="fullname" minlength="3" maxlength="40" size="40" th:field="*{fullname}"  required>
                    <p class="error-message" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}"></p>

                    <label for="txtEmail">E-mail(*): </label>
                    <input type="email" id="txtEmail" name="email" size="40" th:field="*{email}"  required>
                    <p class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

                    <label for="txtTel">Τηλέφωνο: </label>
                    <input type="tel" id="txtTel" name="tel" size="10" th:field="*{tel}" >
                    <p class="error-message" th:if="${#fields.hasErrors('tel')}" th:errors="*{tel}"></p>

                    <label for="txtUsername">Username (*):</label>
                    <input type="text" id="txtUsername" name="username" maxlength="30" th:field="*{username}" required>
                    <p class="error-message" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

                    <label for="txtPassword">Password (*): </label>
                    <input type="password" id="txtPassword" name="password" maxlength="30" th:field="*{password}"  required>
                    <p class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

                    <label for="txtPassword2">Password(ξανά)(*): </label>
                    <input type="password" id="txtPassword2" name="password2" maxlength="30" th:field="*{password2}"  required>
                    <p class="error-message" th:if="${#fields.hasErrors('password2')}" th:errors="*{password}"></p>
                    <p class="error-message" th:if="${#fields.hasErrors('passwordsMatch')}" th:errors="*{passwordsMatch}"></p>

                    <span>(*) Τα πεδία είναι υποχρεωτικά</span>
                    <input type="submit" value="Αποστολή">
                </form>

            </article>

        </th:block>

        <aside th:replace="~{fragments/aside :: aside}"></aside>

    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
