<!DOCTYPE html>
<html lang="gr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body>
<div class="container">
    <header th:replace="~{fragments/header :: header(extended=false)}"></header>

    <main>
        <h1>Επαναφορά Κωδικού</h1>

        <th:block th:switch="${status}">
            <article th:case="'changeDone'">
                <div class="success-message">
                    Το password άλλαξε με επιτυχία! Προχωρήστε σε <a href="/login">login!</a>
                </div>
            </article>

            <article th:case="*">
                <form th:action="@{/password-reset2}" th:object="${formPasswordReset2}" method="post" class="form contact">
                    <label for="txtPassword">Password (*): </label>
                    <input type="password" id="txtPassword" name="password" maxlength="30" th:field="*{password}"  required>
                    <p class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

                    <label for="txtPassword2">Password(ξανά)(*): </label>
                    <input type="password" id="txtPassword2" name="password2" maxlength="30" th:field="*{password2}"  required>
                    <p class="error-message" th:if="${#fields.hasErrors('password2')}" th:errors="*{password}"></p>
                    <p class="error-message" th:if="${#fields.hasErrors('passwordsMatch')}" th:errors="*{passwordsMatch}"></p>

                    <input type="hidden" name="code" th:field="*{code}"/>

                    <input type="hidden" th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <input type="submit" value="Αποστολή">
                </form>

            </article>

        </th:block>

        <aside th:replace="~{fragments/aside :: aside}"></aside>

    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
