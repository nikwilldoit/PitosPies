<!DOCTYPE html>
<html lang="gr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"> </head>

<body>
  <div class="container">
    <header th:replace="~{fragments/header :: header(extended=false)}"> </header>

    <main>
      <h1>Οι Πίτες</h1>
      <article>
        <h2>Οι πίτες μας στο χώρο σας! </h2>
        <p>
          Ωράριο λήψης παραγγελιών (18:00-22:00)
        </p>
        <form action="/sendData" method="GET" class="form buy">
          <section class="customer-info">
            <h3>
              Πληροφορίες Παράδοσης:
            </h3>
            <label for="txtName">Ονοματεπώνυμο(*):</label>
            <input type="text" id="txtName" name="name" minlength="3" maxlength="40" size="40" required>
            <label for="txtAddress">Διεύθυνση(Οδός - Αριθμός)(*):</label>
            <input type="text" id="txtAddress" name="name" minlength="5" maxlength="40" size="40" required>
            <label for="slRegion"> Περιοχή(*):</label>
            <select id="slRegion" name="region" required>
              <option value="ambelokipoi" selected>Αμπελόκηποι</option>
              <option value="papagou">Παπάγου</option>
              <option value="center">Κέντρο Αθήνας</option>
              <option value="zografou">Ζωγράφου</option>
            </select>
            <label for="txtEmail">E-mail: </label>
            <input type="email" id="txtEmail" name="email" size="40">
            <label for="txtTel">Τηλέφωνο(*): </label>
            <input type="tel" id="txtTel" name="phone" size="15" required>
            <label for="txtMessage">Ειδικές Πληροφορίες για την παράδοση: </label>
            <textarea id="txtMessage" name="message" rows="6" cols="40"></textarea>
            <span>(*) Τα πεδία είναι υποχρεωτικά</span>
          </section>

          <section class="order">
            <h3>
              Παραγγελία:
            </h3>
            <label for="txtSpanakopita">Σπανακόπιτες: </label>
            <input type="number" id="txtSpanakopita" name="OrderSpanakopites" min="0" max="100" value="0">
            <label for="txtManitaropita">Μανιταρόπιτες: </label>
            <input type="number" id="txtManitaropita" name="OrderManitaropites" min="0" max="100" value="0">
            <label for="txtPrasopita">Μανιταρόπιτες: </label>
            <input type="number" id="txtPrasopita" name="OrderPrasopites" min="0" max="100" value="0">
            <label for="txtBoureki">Μπουρέκια: </label>
            <input type="number" id="txtBoureki" name="OrderBourekia" min="0" max="100" value="0">
            <input type="checkbox" id="chkΟffer1" name="offer1" value="offer1-on" >
            <label for="chkΟffer1">Ενσωμάτωση προσφοράς στις 10 η 1 πίτα δώρο</label>
          </section>

          <section class="payment">
            <h3>
              Τρόπος Πληρωμής:
            </h3>
            <div class="radio-buttons">
              <input type="radio" id="rdVISA" name="payment" value="visa">
              <label for="rdVISA">VISA</label>
              <input type="radio" id="rdCash" name="payment" value="cash" checked>
              <label for="rdCash">Μετρητά</label>
              <input type="radio" id="rdSpecial" name="payment" value="special">
              <label for="rdSpecial">Είδος</label>
            </div>
          </section>

          <div class="buttons">
            <input type="submit" value="Αποστολή">
            <input type="reset" value="Καθαρισμός">
          </div>
        </form>
      </article>

      <aside th:replace="~{fragments/aside :: aside}"> </aside>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>
</body>


</html>
