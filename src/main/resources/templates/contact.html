<!DOCTYPE html>
<html lang="gr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"> </head>

<body>
  <div class="container">
    <header th:replace="~{fragments/header :: header(extended=false)}"> </header>

    <main>
      <h1>Επικοινωνία</h1>
      <article>
        <form action="/sendData" method="GET" class="form contact">
          <label for="txtName">  Ονοματεπώνυμο(*):</label>
          <input type="text" id="txtName" name="name" minlength="3" maxlength="40" size="40" required>
          <label for="txtEmail">E-mail(*): </label>
          <input type="email" id="txtEmail" name="email" size="40" required>
          <label for="txtTel">Τηλέφωνο: </label>
          <input type="tel" id="txtTel" name="phone" size="15">
          <label for="txtMessage">Μήνυμα(*): </label>
          <textarea id="txtMessage" name="message" rows="6" cols="40" required></textarea>
          <span>(*) Τα πεδία είναι υποχρεωτικά</span>
          <input type="submit" value="Αποστολή">
        </form>
      </article>

      <aside th:replace="~{fragments/aside :: aside}"> </aside>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>
</body>


</html>
