<!DOCTYPE html>
<html lang="gr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body>
<div class="container">
    <header th:replace="~{fragments/header :: header(extended=false)}"></header>

    <main>
        <h1>Επαναφορά Κωδικού</h1>

        <th:block th:switch="${status}">
            <article th:case="'emailNotValid'">
                <div class="error-message">
                    Το e-mail που δώσατε δεν χρησιμοποιείται από κάποιο χρήστη της εφαρμογής!
                    <a th:href="@{/password-reset}">Δοκιμάστε ξανά!</a>
                </div>
            </article>
            <article th:case="'emailValid'">
                <div class="success-message">
                    Στείλαμε μήνυμα με τις απαραίτητες ενέργειες στο email σας!
                </div>
            </article>

            <article th:case="*">
                <form th:action="@{/password-reset}" th:object="${formPasswordReset}" method="post" class="form contact">
                    <label for="txtEmail">E-mail(*): </label>
                    <input type="email" id="txtEmail" name="email" size="40" th:field="*{email}"  required>
                    <p class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>


                    <input type="hidden" th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <input type="submit" value="Αποστολή">
                </form>

            </article>

        </th:block>

        <aside th:replace="~{fragments/aside :: aside}"></aside>

    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
